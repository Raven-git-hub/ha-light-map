                  state: 'off'
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.reading_lamp
    - id: lm_hard_living_all_off
      alias: lm_hard_living_all_off
      description: 'Light Map hard switch: All off button turns switching group All living room lights (4 bulbs) off. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
      mode: queued
      triggers:
        - trigger: state
          entity_id: event.living_room_button
          not_from:
            - unavailable
            - unknown
          not_to:
            - unavailable
            - unknown
      conditions:
        - condition: template
          value_template: "{{ trigger.from_state is not none and trigger.to_state is not none }}"
      actions:
        - action: input_boolean.turn_off
          target:
            entity_id:
              - input_boolean.lm_soft_chandelier_1
              - input_boolean.lm_soft_chandelier_2
              - input_boolean.lm_soft_chandelier_3
              - input_boolean.lm_soft_reading_lamp
    - id: lm_hard_reading_switch
      alias: lm_hard_reading_switch
      description: 'Light Map hard switch: Reading switch is followed by Reading lamp (light.reading_lamp). Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
      mode: queued
      triggers:
        - trigger: state
          entity_id: switch.reading_relay
          from: 'off'
          to: 'on'
          id: 'on'
        - trigger: state
          entity_id: switch.reading_relay
          from: 'on'
          to: 'off'
          id: 'off'
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id: 'on'
              sequence:
                - action: input_boolean.turn_on
                  target:
                    entity_id:
                      - input_boolean.lm_soft_reading_lamp
            - conditions:
                - condition: trigger
                  id: 'off'
              sequence:
                - action: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.lm_soft_reading_lamp
