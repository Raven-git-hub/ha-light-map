    - id: lm_bridge_reading_lamp
      alias: lm_bridge_reading_lamp
      description: 'Light Map soft->bulb bridge: Reading lamp (light.reading_lamp) follows input_boolean.lm_soft_reading_lamp. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
      mode: restart
      triggers:
        - trigger: state
          entity_id: input_boolean.lm_soft_reading_lamp
          from: 'off'
          to: 'on'
        - trigger: state
          entity_id: input_boolean.lm_soft_reading_lamp
          from: 'on'
          to: 'off'
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.lm_soft_reading_lamp
                  state: 'on'
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.reading_lamp
            - conditions:
                - condition: state
