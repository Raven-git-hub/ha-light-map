lm:
  input_boolean:
    lm_soft_chandelier_1:
      name: LM Soft chandelier_1
      icon: mdi:light-switch
    lm_soft_chandelier_2:
      name: LM Soft chandelier_2
      icon: mdi:light-switch
    lm_soft_chandelier_3:
      name: LM Soft chandelier_3
      icon: mdi:light-switch
    lm_soft_kitchen_strip:
      name: LM Soft kitchen_strip
      icon: mdi:light-switch
    lm_soft_porch:
      name: LM Soft porch
      icon: mdi:light-switch
    lm_soft_reading_lamp:
      name: LM Soft reading_lamp
      icon: mdi:light-switch
  automation:
    - id: lm_bridge_chandelier_1
      alias: lm_bridge_chandelier_1
      description: 'Light Map soft->bulb bridge: Chandelier 1 (light.chandelier_1) follows input_boolean.lm_soft_chandelier_1. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
      mode: restart
      triggers:
        - trigger: state
          entity_id: input_boolean.lm_soft_chandelier_1
          from: 'off'
          to: 'on'
        - trigger: state
          entity_id: input_boolean.lm_soft_chandelier_1
          from: 'on'
          to: 'off'
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.lm_soft_chandelier_1
                  state: 'on'
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.chandelier_1
            - conditions:
                - condition: state
                  entity_id: input_boolean.lm_soft_chandelier_1
                  state: 'off'
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.chandelier_1
    - id: lm_bridge_chandelier_2
      alias: lm_bridge_chandelier_2
      description: 'Light Map soft->bulb bridge: Chandelier 2 (light.chandelier_2) follows input_boolean.lm_soft_chandelier_2. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
      mode: restart
