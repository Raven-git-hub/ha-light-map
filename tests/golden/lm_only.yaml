        - trigger: state
          entity_id: input_boolean.lm_soft_chandelier_2
          from: 'off'
          to: 'on'
        - trigger: state
          entity_id: input_boolean.lm_soft_chandelier_2
          from: 'on'
          to: 'off'
      conditions: []
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.lm_soft_chandelier_2
                  state: 'on'
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.chandelier_2
            - conditions:
                - condition: state
                  entity_id: input_boolean.lm_soft_chandelier_2
                  state: 'off'
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.chandelier_2
    - id: lm_bridge_chandelier_3
      alias: lm_bridge_chandelier_3
      description: 'Light Map soft->bulb bridge: Chandelier 3 (light.chandelier_3) follows input_boolean.lm_soft_chandelier_3. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
