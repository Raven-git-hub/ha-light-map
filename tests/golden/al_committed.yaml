input_boolean:
  al_active_living_room:
    name: AL Active living_room
    icon: mdi:lightbulb-auto
  al_hold_living_room:
    name: AL Hold living_room
    icon: mdi:hand-back-right
input_select:
  al_scene_living_room:
    name: AL Scene living_room
    icon: mdi:theme-light-dark
    options:
      - sunrise
      - day
      - afternoon
      - sunset
      - night
      - sleep
automation:
  - id: al_scene_living_room_sunrise
    alias: al_scene_living_room_sunrise
    description: 'Light Map adaptive crossover: Living Room enters sunrise. Each learning unit''s bulbs follow the almanac''s target for the section, through their soft switches. Fired by Light Map with automation.trigger, so it has no triggers and no conditions (automation.trigger skips them). Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
    mode: single
    max_exceeded: silent
    triggers: []
    conditions: []
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.al_active_living_room
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.al_hold_living_room
      - action: input_select.select_option
        target:
          entity_id: input_select.al_scene_living_room
        data:
          option: sunrise
      - variables:
          units: "{% set row = state_attr('sensor.al_almanac_living_room', 'sunrise') %}{{ row.get('units') if row is mapping else none }}"
      - alias: Chandelier (chandelier)
        choose:
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('chandelier') if units is mapping else none %}{{ t is number and t is not boolean and t >= 1 and t <= 255 }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_chandelier_1
                    state: 'on'
                  - condition: state
                    entity_id: light.chandelier_1
                    state: 'on'
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.chandelier_1
                    data:
                      brightness: "{{ units['chandelier'] | int }}"
                      transition: 120
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_chandelier_2
                    state: 'on'
                  - condition: state
                    entity_id: light.chandelier_2
                    state: 'on'
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.chandelier_2
                    data:
                      brightness: "{{ units['chandelier'] | int }}"
                      transition: 120
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_chandelier_3
                    state: 'on'
                  - condition: state
                    entity_id: light.chandelier_3
                    state: 'on'
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.chandelier_3
                    data:
                      brightness: "{{ units['chandelier'] | int }}"
                      transition: 120
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.lm_soft_chandelier_1
                    - input_boolean.lm_soft_chandelier_2
                    - input_boolean.lm_soft_chandelier_3
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('chandelier') if units is mapping else none %}{{ t == 'off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.lm_soft_chandelier_1
                    - input_boolean.lm_soft_chandelier_2
                    - input_boolean.lm_soft_chandelier_3
      - alias: Reading (reading)
        choose:
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('reading') if units is mapping else none %}{{ t is number and t is not boolean and t >= 1 and t <= 255 }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_reading_lamp
                    state: 'on'
                  - condition: state
                    entity_id: light.reading_lamp
                    state: 'on'
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.reading_lamp
                    data:
                      brightness: "{{ units['reading'] | int }}"
                      transition: 120
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.lm_soft_reading_lamp
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('reading') if units is mapping else none %}{{ t == 'off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.lm_soft_reading_lamp
      - delay:
          seconds: 150
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.al_active_living_room
