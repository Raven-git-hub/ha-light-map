            value_template: "{{ [state_attr('automation.al_scene_living_room_sunrise', 'current') | int(0), state_attr('automation.al_scene_living_room_day', 'current') | int(0), state_attr('automation.al_scene_living_room_afternoon', 'current') | int(0), state_attr('automation.al_scene_living_room_sunset', 'current') | int(0), state_attr('automation.al_scene_living_room_sleep', 'current') | int(0), state_attr('automation.al_maint_living_room', 'current') | int(0)] | sum == 0 }}"
        then:
          - action: input_boolean.turn_off
            target:
