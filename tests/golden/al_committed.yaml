  - id: al_scene_living_room_sleep
    alias: al_scene_living_room_sleep
    description: 'Light Map adaptive crossover: Living Room enters sleep. Each learning unit''s bulbs follow the almanac''s target for the section, through their soft switches. Fired by Light Map with automation.trigger, so it has no triggers and no conditions (automation.trigger skips them). Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
    mode: single
    max_exceeded: silent
    triggers: []
    conditions: []
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.al_active_living_room
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.al_hold_living_room
      - action: input_select.select_option
        target:
          entity_id: input_select.al_scene_living_room
        data:
          option: sleep
      - variables:
          units: "{% set row = state_attr('sensor.al_almanac_living_room', 'sleep') %}{{ row.get('units') if row is mapping else none }}"
      - alias: Chandelier (chandelier)
        choose:
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('chandelier') if units is mapping else none %}{{ t is number and t is not boolean and t >= 1 and t <= 255 }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_chandelier_1
                    state: 'on'
                  - condition: state
                    entity_id: light.chandelier_1
                    state: 'on'
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.chandelier_1
                    data:
                      brightness: "{{ units['chandelier'] | int }}"
                      transition: 120
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_chandelier_2
                    state: 'on'
                  - condition: state
                    entity_id: light.chandelier_2
                    state: 'on'
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.chandelier_2
                    data:
                      brightness: "{{ units['chandelier'] | int }}"
                      transition: 120
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_chandelier_3
                    state: 'on'
                  - condition: state
                    entity_id: light.chandelier_3
                    state: 'on'
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.chandelier_3
                    data:
                      brightness: "{{ units['chandelier'] | int }}"
                      transition: 120
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.lm_soft_chandelier_1
                    - input_boolean.lm_soft_chandelier_2
                    - input_boolean.lm_soft_chandelier_3
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('chandelier') if units is mapping else none %}{{ t == 'off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.lm_soft_chandelier_1
                    - input_boolean.lm_soft_chandelier_2
                    - input_boolean.lm_soft_chandelier_3
      - alias: Reading (reading)
        choose:
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('reading') if units is mapping else none %}{{ t is number and t is not boolean and t >= 1 and t <= 255 }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.lm_soft_reading_lamp
                    state: 'on'
                  - condition: state
                    entity_id: light.reading_lamp
                    state: 'on'
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.reading_lamp
                    data:
                      brightness: "{{ units['reading'] | int }}"
                      transition: 120
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.lm_soft_reading_lamp
          - conditions:
              - condition: template
                value_template: "{% set t = units.get('reading') if units is mapping else none %}{{ t == 'off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.lm_soft_reading_lamp
      - delay:
          seconds: 150
      - if:
          - condition: template
            value_template: "{{ [state_attr('automation.al_scene_living_room_sunrise', 'current') | int(0), state_attr('automation.al_scene_living_room_day', 'current') | int(0), state_attr('automation.al_scene_living_room_afternoon', 'current') | int(0), state_attr('automation.al_scene_living_room_sunset', 'current') | int(0), state_attr('automation.al_scene_living_room_night', 'current') | int(0), state_attr('automation.al_maint_living_room', 'current') | int(0)] | sum == 0 }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.al_active_living_room
  - id: al_maint_living_room
    alias: al_maint_living_room
    description: 'Light Map adaptive lux maintenance: nudges Living Room''s adaptive bulbs that are on toward the almanac''s lux target for the section, brightness only. Runs on HA''s own clock, so it carries on while Light Map is down. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: /10
    conditions:
      - condition: state
        entity_id: input_boolean.al_active_living_room
        state: 'off'
      - condition: state
        entity_id: input_boolean.al_hold_living_room
        state: 'off'
    actions:
      - variables:
          row: "{{ state_attr('sensor.al_almanac_living_room', states('input_select.al_scene_living_room')) }}"
          nudge: "{% set enabled = row is mapping and row.get('maintenance_enabled') is sameas true %}{% set target = row.get('lux_target') if row is mapping else none %}{% set margin = (row.get('lux_margin') if row is mapping else none) | float(5) %}{% set vals = ['sensor.living_room_lux'] | map('states') | map('float', none) | reject('none') | select('gt', 0) | list %}{% if not enabled or target is not number or target is boolean or not vals %}none{% else %}{% set lux = vals | sum / vals | count %}{% if lux < target - margin %}up{% elif lux > target + margin %}down{% else %}none{% endif %}{% endif %}"
      - condition: template
        value_template: "{{ nudge != 'none' }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.al_active_living_room
      - alias: Chandelier 1 (light.chandelier_1)
        if:
          - condition: state
            entity_id: input_boolean.lm_soft_chandelier_1
            state: 'on'
          - condition: state
            entity_id: light.chandelier_1
            state: 'on'
          - condition: template
            value_template: "{{ state_attr('light.chandelier_1', 'brightness') | int(0) > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.chandelier_1
            data:
              brightness: "{% set b = state_attr('light.chandelier_1', 'brightness') | int(0) %}{% set pct = (row.get('max_step_pct') if row is mapping else none) | float(0.04) %}{% set pct = [[pct, 0] | max, 1] | min %}{% set step = [[(b * pct) | int(0), 1] | max, 10] | min %}{% if nudge == 'up' %}{{ [b + step, 255] | min }}{% else %}{{ [b - step, 1] | max }}{% endif %}"
              transition: 30
      - alias: Chandelier 2 (light.chandelier_2)
        if:
          - condition: state
            entity_id: input_boolean.lm_soft_chandelier_2
            state: 'on'
          - condition: state
            entity_id: light.chandelier_2
            state: 'on'
          - condition: template
            value_template: "{{ state_attr('light.chandelier_2', 'brightness') | int(0) > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.chandelier_2
            data:
              brightness: "{% set b = state_attr('light.chandelier_2', 'brightness') | int(0) %}{% set pct = (row.get('max_step_pct') if row is mapping else none) | float(0.04) %}{% set pct = [[pct, 0] | max, 1] | min %}{% set step = [[(b * pct) | int(0), 1] | max, 10] | min %}{% if nudge == 'up' %}{{ [b + step, 255] | min }}{% else %}{{ [b - step, 1] | max }}{% endif %}"
              transition: 30
      - alias: Chandelier 3 (light.chandelier_3)
        if:
          - condition: state
            entity_id: input_boolean.lm_soft_chandelier_3
            state: 'on'
          - condition: state
            entity_id: light.chandelier_3
            state: 'on'
          - condition: template
            value_template: "{{ state_attr('light.chandelier_3', 'brightness') | int(0) > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.chandelier_3
            data:
              brightness: "{% set b = state_attr('light.chandelier_3', 'brightness') | int(0) %}{% set pct = (row.get('max_step_pct') if row is mapping else none) | float(0.04) %}{% set pct = [[pct, 0] | max, 1] | min %}{% set step = [[(b * pct) | int(0), 1] | max, 10] | min %}{% if nudge == 'up' %}{{ [b + step, 255] | min }}{% else %}{{ [b - step, 1] | max }}{% endif %}"
              transition: 30
      - alias: Reading lamp (light.reading_lamp)
        if:
          - condition: state
            entity_id: input_boolean.lm_soft_reading_lamp
            state: 'on'
          - condition: state
            entity_id: light.reading_lamp
            state: 'on'
          - condition: template
            value_template: "{{ state_attr('light.reading_lamp', 'brightness') | int(0) > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.reading_lamp
            data:
              brightness: "{% set b = state_attr('light.reading_lamp', 'brightness') | int(0) %}{% set pct = (row.get('max_step_pct') if row is mapping else none) | float(0.04) %}{% set pct = [[pct, 0] | max, 1] | min %}{% set step = [[(b * pct) | int(0), 1] | max, 10] | min %}{% if nudge == 'up' %}{{ [b + step, 255] | min }}{% else %}{{ [b - step, 1] | max }}{% endif %}"
              transition: 30
      - delay:
          seconds: 35
      - if:
          - condition: template
            value_template: "{{ [state_attr('automation.al_scene_living_room_sunrise', 'current') | int(0), state_attr('automation.al_scene_living_room_day', 'current') | int(0), state_attr('automation.al_scene_living_room_afternoon', 'current') | int(0), state_attr('automation.al_scene_living_room_sunset', 'current') | int(0), state_attr('automation.al_scene_living_room_night', 'current') | int(0), state_attr('automation.al_scene_living_room_sleep', 'current') | int(0)] | sum == 0 }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.al_active_living_room
  - id: al_watchdog_guard_living_room
    alias: al_watchdog_guard_living_room
    description: 'Light Map adaptive watchdog: releases Living Room''s guard if it is stuck on, which silently stops maintenance and observation. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.al_active_living_room
        to: 'on'
        for:
          minutes: 10
        id: stuck
      - trigger: event
        event_type: automation_reloaded
        id: reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.al_active_living_room
        state: 'on'
      - condition: template
        value_template: "{{ trigger.id == 'stuck' or [state_attr('automation.al_scene_living_room_sunrise', 'current') | int(0), state_attr('automation.al_scene_living_room_day', 'current') | int(0), state_attr('automation.al_scene_living_room_afternoon', 'current') | int(0), state_attr('automation.al_scene_living_room_sunset', 'current') | int(0), state_attr('automation.al_scene_living_room_night', 'current') | int(0), state_attr('automation.al_scene_living_room_sleep', 'current') | int(0), state_attr('automation.al_maint_living_room', 'current') | int(0)] | sum == 0 }}"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.al_active_living_room
      - if:
          - condition: trigger
            id: stuck
        then:
          - action: persistent_notification.create
            data:
              notification_id: al_watchdog_guard_living_room
              title: Light Map
              message: 'The adaptive guard for Living Room (input_boolean.al_active_living_room) was stuck on for 10 minutes and has been released: a scene or maintenance run probably stopped part-way.'
  - id: al_watchdog_stale_living_room
    alias: al_watchdog_stale_living_room
    description: 'Light Map adaptive watchdog: says so if Living Room hasn''t changed section for 10 hours. Generated by Light Map; edits made in Home Assistant are overwritten on deploy.'
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.al_scene_living_room
        for:
          hours: 10
    conditions: []
    actions:
      - action: persistent_notification.create
        data:
          notification_id: al_watchdog_stale_living_room
          title: Light Map
          message: 'Living Room has not changed section for 10 hours (input_select.al_scene_living_room): Light Map''s adaptive runtime may be down.'
